apiVersion: apps/v1
kind: Deployment
metadata:
  name: java
  namespace: siva-k8s
  labels:
    app: python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: c26
        image: lokeshudatha/python438:v439
        ports:
        - containerPort: 5000

---
apiVersion: v1
kind: Service
metadata:
  name: java-service
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - targetPort: 5000
      port: 80
