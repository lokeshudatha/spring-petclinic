apiVersion: apps/v1
kind: Deployment
metadata:
  name: python
  #namespace: siva-k8s
  labels:
    app: python-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: c27
        image: lokeshudatha/java:v01
        ports:
        - containerPort: 8080

---
apiVersion: v1
kind: Service
metadata:
  name: service462
spec:
  selector:
    app: frontend
  type: NodePort
  ports:
    - targetPort: 8080
      port: 80
